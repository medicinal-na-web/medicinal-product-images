name: Compor imagens de novos produtos

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: compor-imagens
  cancel-in-progress: false

jobs:
  compor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pillow==12.3.0
      - run: python ferramentas/compor_pendentes.py
      - name: Publica as imagens novas
        run: |
          git add vtex
          if git diff --cached --quiet; then echo "Nada novo."; exit 0; fi
          git config user.name "medicinal-imagens-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Imagens de novos produtos (automático)"
          git push
